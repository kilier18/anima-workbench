<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);

body{display:flex;flex-direction:column;overflow:hidden}
body{min-width:1180px;overflow-x:auto}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;padding:5px 8px;outline:none}
button{cursor:pointer}
button:hover{border-color:#3d465a;background:#222836}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.pri:hover{background:#5f9bff}
button.ok{background:var(--acc2);border-color:var(--acc2);color:#06110c;font-weight:600}
textarea{resize:none;width:100%;line-height:1.55}
select{padding:4px 6px}
.small{font-size:12px;color:var(--dim)}

header{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 14px;border-bottom:1px solid var(--line);background:#12151b}
header .logo{font-weight:700;letter-spacing:.5px}
header .sp{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:5px 12px;color:var(--dim)}
.seg button.on{background:var(--acc);color:#fff}
.seg.r18 button.on{background:#c04a68}
.chip-model{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;
  background:#1d2a3a;border:1px solid #2f4a66;color:#8fb4e8;font-size:12px;letter-spacing:.3px}

main{flex:1 1 auto;min-height:0;display:grid;min-width:1180px;
  grid-template-columns:330px minmax(320px,1fr) 372px;
  grid-template-rows:minmax(0,1fr) 292px;
  gap:10px;padding:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}

  border-radius:20px;padding:1px 8px}
.panel>h2 #pfLine{margin-left:auto;cursor:help}
.panel>h2 .badge.ok{color:var(--acc2);border-color:#2b5b46}
.panel>h2 .badge.warn{color:var(--warn);border-color:#5c4526}
.panel .body{flex:1 1 auto;min-height:0;overflow:auto;padding:10px 12px;overscroll-behavior:contain}
#p1{grid-column:1;grid-row:1}
#p2{grid-column:2;grid-row:1}
#p3{grid-column:3;grid-row:1}
#p4{grid-column:1/4;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr) 420px;
  grid-template-rows:auto minmax(0,1fr)}
#p4 .bar{grid-column:1/3;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 12px;border-bottom:1px solid var(--line);background:#141821}
#p4 .left{grid-column:1;grid-row:2;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#p4 .right{grid-column:2;grid-row:2;display:flex;flex-direction:column;min-height:0;overflow:hidden;

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#232936;border:1px solid #2f3646;

.chip b{font-weight:500;color:#dfe4ee}
.chip i{color:var(--dim);font-style:normal;font-size:11px}
.chip .x{color:#7a8296}
.chip:hover{border-color:#4a5568}
.chip.on{background:#2b3a55;border-color:#4c8dff}
.tag{background:#1f2531;border:1px solid #2b3240;border-radius:8px;padding:3px 8px;

#charGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.ccard{border:1px solid #262c38;border-radius:8px;overflow:hidden;background:#1a1f28;cursor:pointer}
.ccard:hover{border-color:#4c8dff}

#prev{flex:1 1 auto;min-height:0;overflow:auto;padding:10px 12px}

#imgs .ph{color:var(--dim);font-size:12px;padding:6px}

.pv-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}

.pv-tags .t{color:#9fc0ff;border-color:#2e3a52}

.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fieldline{display:flex;gap:6px;align-items:center}
.fieldline select{flex:1}
.hint{font-size:11px;color:#6f7788;margin:4px 0 8px}
#prog{position:relative;margin:6px 0 0;height:22px;border:1px solid var(--line);

#prog i{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,#3d6fd1,#6ea8ff);

#prog.run i{width:100%;animation:pg 1.6s linear infinite;background:linear-gradient(90deg,#2b4d8f,#4c8dff,#2b4d8f);
  background-size:200% 100%}
@keyframes pg{0%{background-position:0 0}100%{background-position:-200% 0}}
#prog span{position:relative;display:block;text-align:center;font-size:11px;line-height:20px;color:#cfd6e4}
#prog.done i{width:100%;background:linear-gradient(90deg,#2f7d55,#48b47f)}
#prog.err i{width:100%;background:#8c3b4a}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2a3346;

button.mini{padding:3px 9px;font-size:12px;border-radius:7px;border:1px solid #3c4860;background:#232c3c;color:#9fb0c8;cursor:pointer}
button.mini:hover{color:#e6ecf5;border-color:#5b7fc7}
.mask{position:fixed;inset:0;background:#000a;z-index:70;display:none;align-items:center;justify-content:center}

.modal{background:#1c2432;border:1px solid #3c4860;border-radius:12px;padding:18px 20px;width:min(560px,92vw);box-shadow:0 18px 60px #000b}

  const files = {tags:'wb_tags.json', chars:'wb_chars.json', scenes:'wb_scenes.json', presets:'wb_presets.json', zh:'wb_zh.json', pools:'wb_pools.json', outfits:'wb_outfits.json', atoms:'wb_atoms.json'};
  const out = {};
  await Promise.all(Object.entries(files).map(async ([k,f])=>{
    const r = await fetch('/data/'+f); out[k] = await r.json();
  }));
  S.lib.tags = out.tags; S.lib.chars = out.chars; S.lib.scenes = out.scenes;
  S.lib.presets = out.presets; S.zh = out.zh; S.pools = out.pools; S.lib.outfits = out.outfits; S.atoms = out.atoms;
  const nTags = out.tags.cats.reduce((a,c)=>a+c.tags.length,0);
  // 3.1 起场景只剩 anima 一套；这里必须容错，任何 .length 打空都会让 boot 整段中断（首屏空白）
  const nSc = Object.keys(out.scenes||{}).reduce((a,k)=>a+((out.scenes[k]||[]).length),0);
  $("stat").textContent = "标签 "+nTags+" · 角色 "+out.chars.chars.length+" · 场景 "+nSc;
    // 池化后 actions 是 11 个池的 dict，没有 L1/L2/L3；旧写法 .L1.length 会抛错，
    // 把整个 boot 打断 → 首屏资料库空白（切一次标签才恢复，因为 click 里直接 renderLib）
    try{
      const ac = (out.atoms && out.atoms.actions) || {};
      const tn = Object.keys(ac).reduce((a,k)=>a+((ac[k]||[]).length),0);
      window.__atomN = tn + "条/" + (((out.atoms||{}).meta||{}).combinations||0) + "组合";
    }catch(e){ window.__atomN = "err:" + e.message; }
  $("libCount").textContent = "标签 "+nTags+" / 角色 "+out.chars.chars.length+" / 服饰 "+((out.outfits&&out.outfits.items||[]).length)+" / 场景 "+nSc;
}

    toast("移出服饰："+(t.zh||t.en));

    S.outfit.push(t.en); S.owner[K(t.en)]='outfit';
    addTag([t.en]);

const COUNT_TAGS = ['1girl','1boy','2girls','2boys','multiple_girls','solo','1other'];
function recount(){
  // 人数词一律从"正文里实际存在的角色 tag"重算，避免残留 2girls 又挂 multiple_girls
  S.chars = (S.chars || []).filter(t => S.tags.some(x => x.toLowerCase() === t.toLowerCase()));
  const n = S.chars.length;
  COUNT_TAGS.forEach(t => delTag(t));
  if(n === 0) return 0;                       // 没有角色就不塞人数词（清空/空稿）
  if(n === 1) addTag(['1girl','solo']);
  else if(n === 2) addTag(['2girls']);
  else addTag(['multiple_girls']);
  return n;
}
function setCharLora(id){
  S.charId = id || null;
  fetch('/api/anima/char/select',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:id||''})})
    .then(r=>r.json()).then(j=>{
      if(j.ok) logline("charLora", (j.id||"无") + " → " + ((j.loras||[]).join(" | ")||"-"));
    }).catch(e=>logline("charLora","ERR "+e));
}

function pickChar(c){
  // 累加：点第二个角色不顶掉第一个；再点同一个角色 = 移出
  S.chars = S.chars || [];
  const has = S.tags.some(x=>x.toLowerCase()===c.t.toLowerCase());
  if(has){
    S.tags = S.tags.filter(x=>x.toLowerCase()!==c.t.toLowerCase());
    S.chars = S.chars.filter(x=>x!==c.t);
    S.charTag = S.chars[S.chars.length-1] || null;
    if(S.charId === c.t) setCharLora(null);
    const n = recount(); syncText();
    toast("移出角色：" + (c.zh||c.t) + "（剩 " + n + " 个）");
    return;
  }
  S.chars.push(c.t); S.charTag = c.t; S.owner[K(c.t)] = 'char';
  logline("pickChar", c.t + " chars=" + S.chars.length);
  addTag([c.t].concat(c.g||[]));
  if(c.lora) setCharLora(c.t);
  const n = recount();
  toast("角色 +1（共 " + n + " 个）：" + (c.zh||c.t) + (c.lora ? "（已挂 LoRA）" : ""));
}

  grpSeg.querySelectorAll("button").forEach(btn=>btn.onclick=()=>{
    S.sceneGrp=btn.dataset.grp; grpSeg.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===btn)); draw(); });
  catSeg.onchange=()=>{ S.sceneCat=catSeg.value; draw(); };
  q.oninput=()=>{ S.sceneQ=q.value; draw(); };
  function draw(){
    const sc = (pane && pane.scrollTop) || S.sceneScroll || 0;
    grid.innerHTML="";

    const gp = S.sceneGrp || 'all';

  }
  if(pane && !pane.__scrollBound){
    pane.__scrollBound = true;
    pane.addEventListener('scroll', ()=>{ if(S.tab==='scenes') S.sceneScroll = pane.scrollTop; }, {passive:true});

  draw();
  if(pane){ requestAnimationFrame(()=>{ pane.scrollTop = S.sceneScroll || keepScroll; }); }

const KEEP_ACT = /^(sex|vaginal|anal|oral|fellatio|cunnilingus|paizuri|handjob|footjob|thigh_sex|pussyjob|tribadism|masturbation|fingering|69|missionary|all_fours|doggystyle|sex_from_behind|cowgirl_position|reverse_cowgirl_position|girl_on_top|on_side|standing_sex|mating_press|upright_straddle|amazon_position|piledriver|spooning|straddling|sitting_on_lap|suspended_congress|prone_bone|leg_lift|legs_up|spread_legs|bent_over|against_wall|penis|1boy|2boys|faceless_male|hetero|nude|completely_nude|cum_in_pussy|cumdrip|cum_overflow|excessive_cum|cum_on_body|creampie|uncensored)$/;

// 当前选中的角色包 / 画风包的触发词（换场景时要一起保留，否则框里看不见但后端会补）
function styleTrigTags(){
  const out = [];
  if(S.styleId){
    const st = (S.lib.styles||[]).find(x=>x.id===S.styleId);
    if(st && st.trig) out.push.apply(out, parseTags(escArtist(st.trig)));
  }
  if(S.charId){
    const cc = (S.lib.charsLora||[]).find(x=>x.id===S.charId);
    if(cc && cc.trig) out.push.apply(out, parseTags(cc.trig));
  }
  return out;
}

function applyScene(s, src){
  // 纯场景（s.pure，无动作）：只补地点/光线/天气，不覆盖已有动作与体位
  if(s.pure){
    const PLACE = (s.tags||[]).filter(t=>!KEEP_ACT.test(String(t)));
    const keep = (S.sceneTags||[]).filter(t=>KEEP_ACT.test(String(t)));
    S.sceneTags = uniq(keep.concat(PLACE));
    S.sceneName = (s.zh || s.name_zh || "");
    const base = uniq((S.userTags||[]).concat(S.chars||[]).concat(S.outfit||[]).concat(styleTrigTags()));
    setTags(normTags(base.concat(S.sceneTags)));
    refreshNeg(true);
    toast("已补场景：" + (s.zh||s.id) + " · 动作保留");
    return;
  }
  // 一键覆盖：正文 = 手写词 + 角色词 + 这一套场景词（旧场景整段丢弃）
  const add = (s.tags||[]).filter(Boolean);
  S.sceneTags = add.slice();
  S.sceneName = (s.zh || s.name_zh || "");
  S.scenes = [s.id];
  const base = uniq((S.userTags||[]).concat(S.chars||[]).concat(S.outfit||[]));
  setTags(normTags(base.concat(add)));
  refreshNeg(true);
  toast("已换场景：" + (s.zh||s.id) + " · " + add.length + " 词");
}

function presetLv(p){
  if(p.lv) return p.lv;
  const blob = " " + (p.tags||[]).map(t=>typeof t==='string'? t : (t.en||"")).join(" ").toLowerCase() + " ";
  const K = ["nude","naked","sex","cum","penis","pussy","anal","oral","fellatio","paizuri",
             "nipple","bondage","shibari","ahegao","vaginal","creampie","orgasm","squirt",
             "masturbat","dildo","hetero","1boy","doggystyle","cowgirl","missionary"];
  return K.some(k=>blob.includes(k)) ? 'r18' : 'sfw';
}

function renderPresets(b){
  b.innerHTML="";
  const all = (S.lib.presets.forge||[]).map(p=>({p:p,src:'forge'})).concat(
              (S.lib.presets.anima||[]).map(p=>({p:p,src:'anima'})));
  const cnt = {sfw:0, suggestive:0, r18:0};
  all.forEach(x=>{ const lv=presetLv(x.p); cnt[lv]=(cnt[lv]||0)+1; });

  if(!S.presetGrp) S.presetGrp = (S.tier==='r18') ? 'r18' : (S.tier==='suggestive' ? 'suggestive' : 'sfw');
  const seg=document.createElement("div"); seg.className="seg"; seg.style.marginBottom="10px";
  [['sfw','常规 '+cnt.sfw],['suggestive','暧昧 '+cnt.suggestive],['r18','R18 '+cnt.r18],['all','全部 '+all.length]].forEach(([v,label])=>{
    const btn=document.createElement("button"); btn.dataset.g=v; btn.textContent=label;
    if(S.presetGrp===v) btn.className="on";
    if(v!=='sfw' && v!=='all' && S.tier!=='r18' && !(v==='suggestive' && S.tier==='suggestive')){ btn.disabled=true; btn.title="对应档位才能用"; }
    btn.onclick=()=>{ S.presetGrp=v; renderPresets(b); };
    seg.appendChild(btn);
  });
  b.appendChild(seg);

  const list = all.filter(x=>{
    const lv = presetLv(x.p);
    if(S.presetGrp==='all') return true;
    return lv === S.presetGrp;
  });
  const hint=document.createElement("div"); hint.className="hint";
  hint.textContent = "共 "+list.length+" 条 · 当前档位 "+(S.tier==='r18'?'R18':'非 R18')+"（档位在顶栏切换）";
  b.appendChild(hint);

  const grid=document.createElement("div"); grid.className="grid";
  list.forEach(({p,src})=>{
    const tags=(p.tags||[]).map(t=>typeof t==='string'? t : (t.en||"")).filter(Boolean);
    const d=document.createElement("span"); d.className="tag";
    const nm = (p.name||'预设');
    d.innerHTML='<b>'+esc(nm)+'</b>'+(p.note||p.desc?'<span class="zh">'+esc((p.note||p.desc||'').slice(0,12))+'</span>':'');
    d.title=tags.join(", ");
    d.onclick=()=>applyPreset(tags, nm, p.neg, p.lv);
    grid.appendChild(d);
  });
  b.appendChild(grid);

  function applyPreset(tags,name,neg,lv){
    // 追加：保留已选角色与已写内容，预设只往后面接
    const keep = S.tags.slice();
    setTags(normTags(keep.concat(tags)));
    S.chars = (S.chars||[]).filter(t => S.tags.some(x => x.toLowerCase() === t.toLowerCase()));
    if(neg && neg.length) $("neg").value = (typeof neg==='string'? neg : neg.join(", "));
    else refreshNeg(false);
    recount(); syncText();
    toast("预设叠加：" + name + (lv?(" · "+lv):"") + "（+ " + tags.length + " 词，共 " + S.tags.length + "）");
  }
}

/* 画师名里的括号会被 ComfyUI 当成权重语法：
   kanpa_(campagne_9) → 解析成「kanpa_」+ 权重组，画师 tag 直接失效。
   插进提示词前统一转义成 kanpa_\\(campagne_9\\)。 */
function escArtist(t){
  /* Anima 是 Cosmos-Predict2，不吃 (tag:1.3) 这种权重语法，画师要写 @ 前缀、
     名字里的括号属于名字本身：kanpa_(campagne_9) → @kanpa (campagne 9)。 */
  const s = String(t).trim();
  if(!s) return '';
  /* 多词触发词（如 claude_girl, orange hair, ...）按列表原样用，不能整串加 @ */

  if(hasU(a)){

  const DAY_W = ['morning','day','afternoon','noon','sunrise','dawn'];
  const NIGHT_W = ['night','midnight','starry_sky','moonlight','evening','dusk','sunset'];
  const TIME_W = DAY_W.concat(NIGHT_W);

  if(tHits.length > 1){
    // 白天词与夜晚/星空同时出现 = "早上七点的满天星"，先保留下来的第一个
    cut(tHits.slice(1).map(low));

  }

    {cut:['cowboy_shot','upper_body'], add:['full_body'],
     when:['all_fours','kneeling','sitting_on_lap','straddling'], zh:'跪趴/坐腿改全身'},

     when:['suspended_congress','carrying','leg_lift','over_shoulder','princess_carry','lifting_person'], zh:'悬空/抱着必须全身'},

     when:['fellatio','deepthroat','kneeling'], zh:'俯视看不见跪姿'},
    {cut:['leg_wrap'], add:[],
     when:['straddling'], zh:'缠腿+跨坐会多腿'},
    {cut:['from_below'], add:['from_side'],
     when:['69','sitting_on_face','lying','on_back','on_stomach'], zh:'叠体仰视会切人'},
    {cut:['close-up','upper_body'], add:['full_body'],
     when:['sex','vaginal','anal','double_penetration','doggystyle','missionary','sex_from_behind',
            'tribadism','cunnilingus','fingering','girl_on_top','69','sitting_on_face','scissoring',
            'paizuri','irrumatio','handjob','thigh_sex','group_sex','spitroast',
            'cowgirl_position','reverse_cowgirl_position','straddling','all_fours','leg_lift',
            'standing_sex','mating_press','spooning','upright_straddle','suspended_congress',
            'prone_bone','full_nelson','piledriver','amazon_position','squatting_cowgirl_position',
            'deep_penetration','tentacle_sex','sex_machine','dildo_riding','object_insertion'], zh:'性交动作要全身'},

     when:['leg_lift','standing_sex'], zh:'抬腿/站立后入腿位置无解'},
  ];
  for(let i=0;i<VFIX.length;i++){
    const v = VFIX[i];
    if(!v.when.some(k2=>has(k2))) continue;
    const hit = v.cut.filter(k2=>has(k2));
    if(!hit.length) continue;
    cut(hit);
    for(let j=0;j<v.add.length;j++) if(!has(v.add[j])) a.push(v.add[j]);
    rep.fixes.push(v.zh);
  }
  // 姿态互斥：站/走 与 床/地 不能同时成立（画成"站着躺在床上"）
  if(['standing','walking','standing_sex','tiptoes'].some(k2=>has(k2)) &&
     ['on_bed','on_floor'].some(k2=>has(k2)) && !has('on_side') && !has('on_stomach')){
    const n3 = cut(['on_bed','on_floor']);
    if(n3) rep.fixes.push('站姿去掉床/地 ' + n3);
  }
  // 姿态互斥：躺 与 跪/趴 不能同时成立（动作侧优先）
  if(has('lying') && ['kneeling','all_fours','squatting'].some(k2=>has(k2))){
    cut(['lying']); rep.fixes.push('躺姿与跪趴互斥');
  }
  // 无脸男没有脸，不能"对视/面对面"
  if(has('faceless_male')){
    const noFace = ['face-to-face','looking_at_another','eye_contact','looking_back'].filter(k2=>has(k2));
    if(noFace.length){ cut(noFace); rep.fixes.push('无脸男不能对视'); }
  }
  // 多人 + 倾斜机位：两人肢体交界处最容易糊
  if(has('dutch_angle') && (has('group_sex') || has('spitroast') || has('threesome'))){
    cut(['dutch_angle']); rep.fixes.push('倾斜机位多人会糊');
  }

  rep.kind = k;
  rep.pool = R ? o.pool : '';
  rep.n = a.length;
  S.sceneKind = k;
  return {tags: a, rep: rep};
}

function pfShow(rep, tagN){
  const el = $("pfLine"); if(!el) return;
  const zh = PF_KIND_ZH[rep.kind] || rep.kind || '—';
  const fixed = rep.fixes.length;
  el.textContent = '审查 ' + (fixed ? '修' + fixed : '✓') + ' · ' + zh + ' · ' + (tagN || rep.n) + ' 词';
  el.className = 'badge ' + (fixed ? 'warn' : 'ok');
  el.title = (rep.pool ? '池：' + (POOL_ZH[rep.pool] || rep.pool) + '\n' : '') + (fixed ? rep.fixes.join('；') : '人数 / 性别 / 道具一致');
}

function pfDryRun(){
  try{
    const pf = preflight(S.tags, {kind: S.sceneKind, pool: S.scenePool, zh: S.sceneZh});
    pfShow(pf.rep, pf.tags.length);
  }catch(e){}
}

/* ============ 绑定 ============ */
function bind(){
  $("pos").addEventListener("blur",()=>{
    // 手动改过提示词就不再按上次的池管（否则审查会删掉用户自己写的词）
    S.scenePool = ''; S.sceneKind = '';
    setTags(parseTags($("pos").value));
  });
  $("pos").addEventListener("input",()=>{ $("posCount").textContent=parseTags($("pos").value).length+" 词"; });
  $("btnExpand").onclick=doExpand;
  $("btnNorm").onclick=()=>{ setTags(normTags(parseTags($("pos").value))); refreshNeg(true); toast("已按规则整理"); };
  $("btnClear").onclick=()=>{
    // 清空必须把“归属表”一起清掉：历史角色/服饰都存在 userTags/owner 里，
    // 只清 tags/chars 会让上一次的角色在批量时被 base 重新拼回来（两个角色 tag 的根因）
    S.tags=[]; S.chars=[]; S.charTag=null; S.scenes=[]; S.sel={}; S.outfit=[];
    S.userTags=[]; S.owner={}; S.sceneTags=[]; S.sceneName="";
    setTags([]); recount(); syncText(); $("neg").value=""; refreshNeg(true);
    logline("clear");
    toast("已清空（角色/服饰/人数词全部归零）");
  };
  $("btnNegReset").onclick=()=>refreshNeg(true);
  $("btnRoll").onclick=()=>rollLibrary();
  $("btnCfg").onclick=()=>openCfg();
  $("cfgCancel").onclick=()=>closeCfg();
  $("cfgSave").onclick=()=>saveCfg();
  $("cfgMask").onclick=(e)=>{ if(e.target===$("cfgMask")) closeCfg(); };
  $("libRoll").onclick=()=>rollLibrary();
  $("studioRoll").onclick=rollAll;
  $("btnGen").onclick=generate;
  $("btnBatch").onclick=batchRun;
  $("btnLog").onclick=showLog;
  $("btnPause").onclick=()=>{
    if(!S.batch){ toast("没有在跑的批量"); return; }
    S.pauseAsk = true;
    $("btnPause").textContent = "⏸ 正在停…";
    $("btnPause").disabled = true;
    toast("当前这张跑完就暂停");
  };
  $("btnHand").onclick=handfix;
  $("btnCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(S.tags.join(", ")); toast("已复制"); }catch(e){ toast("复制失败"); } };
  document.querySelectorAll("#libTabs button[data-t]").forEach(b=>b.onclick=()=>{
    S.tab=b.dataset.t; document.querySelectorAll("#libTabs button[data-t]").forEach(x=>x.classList.toggle("on",x===b)); renderLib();
  });
  document.querySelectorAll("#tierSeg button").forEach(b=>b.onclick=()=>{
    S.tier=b.dataset.v; document.querySelectorAll("#tierSeg button").forEach(x=>x.classList.toggle("on",x===b));
    S.presetGrp = (S.tier==='r18') ? 'r18' : 'sfw';
    refreshNeg(true); renderLib();
    toast(S.tier==='r18'
      ? "R18 档：放开 🔞 类目 / r18 场景 / r18 预设"
      : (S.tier==='suggestive' ? "Suggestive 档：只留非 R18 类目，负面加强" : "SFW 档：隐藏 r18 场景与预设，负面加防护词"));
  });
  S.model='anima'; setModelDefaults('anima');
  $("big").onclick=()=>{ $("big").style.display='none'; };
  // 滚轮落在 select 上时也滚容器
  document.addEventListener('wheel', ev=>{
    const t=ev.target;
    if(t && (t.tagName==='SELECT' || t.tagName==='INPUT')){}
    else return;
    const pane=t.closest('.body')||t.closest('#prev')||t.closest('#imgs');
    if(!pane) return;
    ev.preventDefault(); pane.scrollTop += ev.deltaY;
  }, {passive:false});
}

const SFW_CATS = ["style","artist","composition","camera","lighting","base","body","pose","expression","hair","face","clothing","accessory","environment","weather","props","extra","text"];
/* 随机一套 = 与批量完全同一套组合逻辑（composeShot 抽池 → 合并角色/服装 → 审查），
   不再用旧的"随机 5–9 个类别标签"，否则同一个种子在单张和批量里行为不一致。 */
function rollLibrary(){
  const sc = composeShot(0,1);
  if(!sc){ toast("抽取失败：池为空"); return; }
  setTags(normTags(uniq((S.userTags||[]).concat(S.chars||[]).concat(S.outfit||[]).concat(styleTrigTags())).concat(sc.tags)));
  S.sceneTags = sc.tags.slice(); S.sceneName = sc.zh; S.lastLv = sc.lv;
  S.sceneKind = sc.kind || ''; S.scenePool = sc.pool || '';
  cleanTags(); refreshNeg(true);
  const pf = preflight(S.tags, {kind:S.sceneKind, pool:S.scenePool, zh:S.sceneZh});
  S.tags = pf.tags; syncText(); pfShow(pf.rep, S.tags.length);
  toast("随机：" + (sc.zh||"组合") + (pf.rep.fixes.length? " · 审查修 "+pf.rep.fixes.length : ""));
}

(async function boot(){
  bind();
  try{ await loadData(); }catch(e){ console.error("boot/loadData", e); $("stat").textContent="数据加载失败 "+(e&&e.stack||e); return; }
  try{ const r = await fetch('/api/styles'); const j = await r.json();
    if(j.ok){ S.lib.styles = j.styles || []; S.styleId = j.current || null; }
  }catch(e){ console.error("boot/styles", e); }
  try{ const r2 = await fetch('/api/anima/chars'); const j2 = await r2.json();
    if(j2.ok){ S.lib.charsLora = j2.chars || []; S.charId = j2.current || null; }
  }catch(e){ console.error("boot/charLora", e); }
  renderLib(); renderStudio(); syncText();
  $("neg").value = defaultNeg();
  $("stat").textContent += " · 就绪";
})();
window.addEventListener('error', ()=>{ window.__ERR = (window.__ERR||0)+1; });
