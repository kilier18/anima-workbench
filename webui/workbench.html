<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>工坊 · 提示词 / 资料库 / Studio / 出图</title>
<style>
:root{
  --bg:#0f1116; --panel:#171a21; --panel2:#1d212a; --line:#2a2f3a;
  --tx:#e6e8ee; --dim:#8b93a3; --acc:#4c8dff; --acc2:#43c08a; --warn:#e0a34d;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
  font:13px/1.5 "Microsoft YaHei","Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
body{min-width:1180px;overflow-x:auto}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;padding:5px 8px;outline:none}
button{cursor:pointer}
button:hover{border-color:#3d465a;background:#222836}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.pri:hover{background:#5f9bff}
button.ok{background:var(--acc2);border-color:var(--acc2);color:#06110c;font-weight:600}
textarea{resize:none;width:100%;line-height:1.55}
select{padding:4px 6px}
.small{font-size:12px;color:var(--dim)}

header{flex:0 0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 14px;border-bottom:1px solid var(--line);background:#12151b}
header .logo{font-weight:700;letter-spacing:.5px}
header .sp{flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:5px 12px;color:var(--dim)}
.seg button.on{background:var(--acc);color:#fff}
.seg.r18 button.on{background:#c04a68}
.chip-model{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;
  background:#1d2a3a;border:1px solid #2f4a66;color:#8fb4e8;font-size:12px;letter-spacing:.3px}

main{flex:1 1 auto;min-height:0;display:grid;min-width:1180px;
  grid-template-columns:330px minmax(320px,1fr) 372px;
  grid-template-rows:minmax(0,1fr) 292px;
  gap:10px;padding:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.panel>h2{margin:0;padding:8px 12px;font-size:13px;font-weight:600;color:#cfd6e4;
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;background:#141821}
.panel>h2 .badge{font-size:11px;color:var(--dim);font-weight:400;border:1px solid var(--line);
  border-radius:20px;padding:1px 8px}
.panel>h2 #pfLine{margin-left:auto;cursor:help}
.panel>h2 .badge.ok{color:var(--acc2);border-color:#2b5b46}
.panel>h2 .badge.warn{color:var(--warn);border-color:#5c4526}
.panel .body{flex:1 1 auto;min-height:0;overflow:auto;padding:10px 12px;overscroll-behavior:contain}
#p1{grid-column:1;grid-row:1}
#p2{grid-column:2;grid-row:1}
#p3{grid-column:3;grid-row:1}
#p4{grid-column:1/4;grid-row:2;display:grid;grid-template-columns:minmax(0,1fr) 420px;
  grid-template-rows:auto minmax(0,1fr)}
#p4 .bar{grid-column:1/3;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:8px 12px;border-bottom:1px solid var(--line);background:#141821}
#p4 .left{grid-column:1;grid-row:2;display:flex;flex-direction:column;min-height:0;overflow:hidden}
#p4 .right{grid-column:2;grid-row:2;display:flex;flex-direction:column;min-height:0;overflow:hidden;
  border-left:1px solid var(--line)}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#232936;border:1px solid #2f3646;
  border-radius:999px;padding:2px 8px;font-size:12px;cursor:pointer}
.chip b{font-weight:500;color:#dfe4ee}
.chip i{color:var(--dim);font-style:normal;font-size:11px}
.chip .x{color:#7a8296}
.chip:hover{border-color:#4a5568}
.chip.on{background:#2b3a55;border-color:#4c8dff}
.tag{background:#1f2531;border:1px solid #2b3240;border-radius:8px;padding:3px 8px;
  font-size:12px;cursor:pointer;white-space:nowrap}
.tag:hover{border-color:#4c8dff;background:#243044}
.tag .zh{color:var(--dim);margin-left:5px;font-size:11px}
.grid{display:flex;flex-wrap:wrap;gap:6px}

.tabs{display:flex;gap:6px;padding:0 12px 8px;flex-wrap:wrap}
.tabs button{padding:4px 10px;font-size:12px}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}

#catbar{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
#catbar button{font-size:12px;padding:3px 9px}
#catbar button.on{background:#2b3a55;border-color:#4c8dff}

#charGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.ccard{border:1px solid #262c38;border-radius:8px;overflow:hidden;background:#1a1f28;cursor:pointer}
.ccard:hover{border-color:#4c8dff}
.ccard .ph{width:100%;aspect-ratio:96/134;background:#232936 center/cover no-repeat;
  display:flex;align-items:center;justify-content:center;font-size:20px;color:#4a5366}
.ccard .ph{color:#4a5366}
.ccard .nm{padding:3px 5px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ccard .tw{padding:0 5px 4px;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}

#secList .sec{margin-bottom:7px;border:1px solid #252b37;border-radius:8px;background:#1a1f27}
#secList .sec>.hd{display:flex;align-items:center;gap:6px;padding:6px 9px;cursor:pointer;
  font-size:12px;color:#cfd6e4}
#secList .sec>.hd .n{color:var(--dim);font-size:11px}
#secList .sec>.bd{display:none;padding:0 9px 9px}
#secList .sec.open>.bd{display:block}
#secList .fld{margin-bottom:6px}
#secList .fld label{display:block;font-size:11px;color:var(--dim);margin-bottom:2px}
#secList select{width:100%}

#prev{flex:1 1 auto;min-height:0;overflow:auto;padding:10px 12px}
#imgs{flex:1 1 auto;min-height:0;overflow:auto;padding:10px;display:flex;flex-wrap:wrap;gap:8px;
  align-content:flex-start}
#imgs img{height:150px;border-radius:8px;border:1px solid #2a3140;cursor:pointer;background:#111}
#imgs .ph{color:var(--dim);font-size:12px;padding:6px}
#big{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;
  z-index:50;cursor:zoom-out}
#big img{max-width:94vw;max-height:94vh;border-radius:6px}
.pv-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.pv-tags .t{background:#20283a;border:1px solid #2e3a52;border-radius:6px;padding:2px 7px;font-size:11px}
.pv-tags .t{color:#9fc0ff;border-color:#2e3a52}
.pv-tags .t .z{color:#7e8798;margin-left:4px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.hint{font-size:11px;color:#6f7788;margin:4px 0 8px}
#prog{position:relative;margin:6px 0 0;height:22px;border:1px solid var(--line);
  border-radius:11px;background:#151a22;overflow:hidden}
#prog i{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,#3d6fd1,#6ea8ff);
  transition:width .35s ease}
#prog.run i{width:100%;animation:pg 1.6s linear infinite;background:linear-gradient(90deg,#2b4d8f,#4c8dff,#2b4d8f);
  background-size:200% 100%}
@keyframes pg{0%{background-position:0 0}100%{background-position:-200% 0}}
#prog span{position:relative;display:block;text-align:center;font-size:11px;line-height:20px;color:#cfd6e4}
#prog.done i{width:100%;background:linear-gradient(90deg,#2f7d55,#48b47f)}
#prog.err i{width:100%;background:#8c3b4a}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2a3346;
  border:1px solid #3c4860;padding:7px 14px;border-radius:8px;font-size:12px;opacity:0;
  transition:opacity .2s;pointer-events:none;z-index:60}
#toast.on{opacity:1}
button.mini{padding:3px 9px;font-size:12px;border-radius:7px;border:1px solid #3c4860;background:#232c3c;color:#9fb0c8;cursor:pointer}
button.mini:hover{color:#e6ecf5;border-color:#5b7fc7}
.mask{position:fixed;inset:0;background:#000a;z-index:70;display:none;align-items:center;justify-content:center}
.mask.on{display:flex}
.modal{background:#1c2432;border:1px solid #3c4860;border-radius:12px;padding:18px 20px;width:min(560px,92vw);box-shadow:0 18px 60px #000b}
.modal h3{margin:0 0 4px;font-size:15px;color:#e6ecf5}
.modal input{width:100%;box-sizing:border-box;padding:9px 11px;border-radius:8px;border:1px solid #3c4860;
  background:#12181f;color:#e6ecf5;font-size:13px;font-family:inherit}
</style>
</head>
<body>
<header>
  <span class="logo">工坊</span>
  <span class="chip-model" title="3.1 起统一使用 Anima 底模">Anima</span>
  <span class="sp"></span>
  <span class="small" id="stat">加载中…</span>
  <button id="btnCfg" class="mini" title="设置出图目录">⚙ 目录</button>
  <div class="seg" id="tierSeg">
    <button data-v="sfw" class="on">SFW</button>
    <button data-v="suggestive">Suggestive</button>
    <button data-v="r18" class="r18">R18</button>
  </div>
</header>

<main>
  <!-- ① 提示词 -->
  <section class="panel" id="p1">
    <h2>① 提示词 <span class="badge" id="posCount">0 词</span>
      <span class="badge" id="pfLine" title="出图前审查：人数 / 性别 / 道具一致性">审查 —</span></h2>
    <div class="body">
      <textarea id="pos" rows="7" placeholder="写中文（灵梦 后入 吐舌头 全身）或直接贴 tag，选词会追加到这里"></textarea>
      <div class="row" style="margin:6px 0 10px">
        <button id="btnExpand" class="pri">本地扩写</button>
        <button id="btnNorm">规则整理</button>
        <button id="btnClear">清空</button>
        <button id="btnRoll">🎲 随机一套</button>
      </div>
      <div class="small" style="margin-bottom:4px">负面（自动补，可改）</div>
      <textarea id="neg" rows="3"></textarea>
      <div class="row" style="margin-top:6px">
        <button id="btnNegReset">恢复默认负面</button>
      </div>
      <div class="small" style="margin:10px 0 4px">中文对照</div>
      <div class="chips" id="zhChips"></div>
    </div>
  </section>

  <!-- ② 资料库 -->
  <section class="panel" id="p2">
    <h2>② 资料库 <span class="badge" id="libCount"></span></h2>
    <div class="tabs" id="libTabs">
      <button data-t="tags" class="on">标签</button>
      <button data-t="chars">角色</button>
      <button data-t="scenes">场景</button>
      <button data-t="presets">预设</button>
      <button data-t="artists">画风</button>
      <button data-t="outfits">服饰道具</button>
      <button id="libRoll" style="margin-left:auto">🎲 本页随机</button>
    </div>
    <div class="body" id="libBody"></div>
  </section>

  <!-- ③ Studio -->
  <section class="panel" id="p3">
    <h2>③ Studio 15 段 <span class="badge" id="studioCount"></span>
      <button id="studioRoll" style="margin-left:auto;font-size:12px;padding:3px 9px">🎲 全部随机</button>
    </h2>
    <div class="body" id="secList"></div>
  </section>

  <!-- ④ 预览与出图 -->
  <section class="panel" id="p4">
    <div class="bar">
      <span class="small">预览</span>
      <span class="small" id="pvCount">0 词</span>
      <span class="sp" style="flex:1"></span>
      <span class="small">尺寸</span>
      <select id="qSize">
        <option value="1024x1536">1024×1536</option>
        <option value="832x1216">832×1216</option>
        <option value="1152x1728">1152×1728</option>
        <option value="1216x832">1216×832</option>
        <option value="1536x1024">1536×1024</option>
      </select>
      <span class="small">步数</span><input id="qSteps" type="number" min="1" max="60" value="10" style="width:64px">
      <span class="small">CFG</span><input id="qCfg" type="number" step="0.1" min="0.5" max="12" value="1" style="width:60px">
      <span class="small">采样</span>
      <select id="qSampler">
        <option>er_sde</option><option>euler_ancestral</option><option>euler</option><option>dpmpp_2m</option>
      </select>
      <span class="small">调度</span>
      <select id="qSched"><option>beta</option><option>normal</option><option>karras</option></select>
      <span class="small">种子</span><input id="qSeed" type="number" value="-1" style="width:96px">
      <label class="small" title="动作×地点×光线×强度×构图×机位 随机组合，动作本批不重复"><input type="checkbox" id="qCompose" checked> 组合抽词</label>
      <select id="qBust" title="体型由你定：贫乳/小胸时压住大胸先验，并去掉乳交类接触（paizuri/breast_press）—— 词库里没有胸围词，胸是动作语义带来的">
  <option value="">体型·自动</option><option value="flat">贫乳</option><option value="small">小胸</option>
  <option value="medium">普通</option><option value="large">大胸</option></select>
<label class="small" title="一批图当一场戏：准备→前戏→玩法→正戏→事后；角色/地点/光照本批锁定，只脱不穿（强制项）。衣服不会自动换：角色卡自带的 + 你在服饰面板手选的，两者之外的具体衣物词一律剔掉"><input type="checkbox" id="qStory"> 连续剧情</label>
      <label class="small" title="加 speech_bubble：画面出现漫画式对话框"><input id="qBubble" type="checkbox"> 对话框</label>
      <label class="small" title="参考图锁定：连续剧情第 2 张起，把上一张拿去做 AnimaRefAdapter 的参考图。单人（比如博丽灵梦这种原作 tag）长相本来就稳，不用开；两个以上不同角色卡同框才会串脸——勾了自动在多角色时开（每张多约 10 秒）"><input type="checkbox" id="qRef"> 参考图锁定
      <label class="small" title="cfg=1 时负向完全不参与，开这个才压得住多余的手/文字/男性身体；约 +4 秒一张"><input type="checkbox" id="qNag" checked> 负面生效</label>
<select id="qRefAnchor" title="锚点：锚本块第一张 = 每个块的第一张不挂参考图，块内差分都锚它（推荐，块与块之间不会串；上一张 = 逐张接力，会把上一张的崩坏一路放大）">
<option value="block" selected>锚本块第一张</option>
<option value="shot">锚上一张（链式）</option>
</select>
      <select id="qRefGuid" title="参考图强度：1=参考走两条 CFG 分支，不额外多算模型（默认，最省）；2.5=更贴参考但每步多一次模型调用，慢一倍">
        <option value="1" selected>参考 1</option>
        <option value="1.5">参考 1.5</option>
        <option value="2.5">参考 2.5</option>
      </select>
      <span class="small" title="需要男性时的处理：无脸男 / 隐形男(只剩压痕与动作) / 只有阴茎">男体</span>
      <select id="qScene" title="场景类型：自动=按角色数推断；锁定后只从该类三档池抽动作">
        <option value="auto" selected>自动</option>
        <option value="solo">单人</option>
        <option value="duo">双人·男女</option>
        <option value="yuri">女同</option>
        <option value="machine">机械</option>
        <option value="bdsm">调教</option>
        <option value="tentacle">触手</option>
        <option value="triple">3P</option>
        <option value="hypno">催眠</option>
        <option value="exhibition">露出·偷窥</option>
      </select>
      <select id="qMale" title="需要男性时的处理：无脸男 / 隐形男(只剩压痕与动作) / 只有阴茎">
        <option value="invisible" selected>隐形男</option>
        <option value="faceless">无脸男</option>
        <option value="penis">只有阴茎</option>
      </select>
      <select id="qSock" title="丝袜只认你选的这一种（足交也照样只画这种）；不穿=腿脚动作也不加袜子">
        <option value="" selected>丝袜·不穿（默认）</option>
        <option value="none">不要丝袜</option>
        <option value="pantyhose">连裤袜</option>
        <option value="black_pantyhose">黑色连裤袜</option>
        <option value="white_pantyhose">白色连裤袜</option>
        <option value="fishnet_pantyhose">渔网连裤袜</option>
        <option value="thighhighs">过膝袜</option>
        <option value="black_thighhighs">黑色过膝袜</option>
        <option value="white_thighhighs">白色过膝袜</option>
        <option value="fishnet_thighhighs">渔网过膝袜</option>
        <option value="stockings">长袜</option>
        <option value="black_stockings">黑色长袜</option>
        <option value="white_stockings">白色长袜</option>
        <option value="lace_stockings">蕾丝长袜</option>
        <option value="sheer_stockings">透明长袜</option>
        <option value="torn_pantyhose">破洞连裤袜</option>
        <option value="striped_socks">条纹袜</option>
        <option value="frilled_socks">蕾丝边袜</option>
        <option value="socks">短袜</option>
        <option value="black_socks">黑袜</option>
        <option value="white_socks">白短袜</option>
        <option value="ankle_socks">脚踝袜</option>
        <option value="kneehighs">及膝袜</option>
        <option value="garter_belt">吊袜带</option>
      </select>
      <button id="btnGen" class="pri">🎨 生成</button>
      <span class="small">批量</span><input id="batchN" type="number" value="8" min="1" max="60" style="width:64px">
      <button id="btnBatch" class="pri" style="background:#2f6f4f">🎬 批量出图</button>
      <button id="btnPause" disabled>⏸ 暂停</button>
      <button id="btnHand">🔧 修手</button>
      <button id="btnCopy">复制提示词</button>
      <button id="btnLog">📋 日志</button>
    </div>
    <div id="prog"><i id="progBar"></i><span id="progTxt">待机</span></div>
    <div class="left">
      <div id="prev"></div>
    </div>
    <div class="right">
      <div id="imgs"><div class="ph">生成的图会出现在这里</div></div>
    </div>
  </section>
</main>
<div id="big"><img alt=""></div>
<div id="toast"></div>
<div id="cfgMask" class="mask"><div class="modal">
  <h3>出图目录</h3>
  <p class="small" style="margin:2px 0 8px">改完会重启 ComfyUI 才生效（约 20–40 秒）。目录必须已存在或能被创建、且可写。</p>
  <input id="cfgDir" spellcheck="false" placeholder="例如 D:\\ComfyUI\\output">
  <div class="small" id="cfgNow" style="margin:6px 0 2px"></div>
  <div class="row" style="justify-content:flex-end;gap:8px;margin-top:14px">
    <button id="cfgCancel">取消</button>
    <button id="cfgSave" class="pri">保存并重启</button>
  </div>
</div></div>

<script>
/* ============ 状态 ============ */
const S = {bubble:false, 
  tags: [], neg: [], charTag: null, sceneTags: [], sceneName: '', chars: [], scenes: [], sceneGrp: 'all', sceneCat: '全部', sceneQ: '', sceneScroll: 0,
  tier: 'sfw', model: 'anima', imgs: [], last: null, presetGrp: null,
  lib: {tags:null, chars:null, scenes:null, presets:null, artists:null, outfits:null, styles:null},
  tab: 'tags', cat: null, charLimit: 160, charWork: '', charQ: '',
  zh: {}, pools: null, sel: {}, sectionOpen: {}, owner: {}, userTags: [],
  // 连续剧情（2026-11-14）：story=本批按五阶段推进；sceneGarb=本张的衣物状态（强制项，
  // 传给 preflight.forceGarb）；storyLock=本批锁定的角色地点光照机位
  story: false, storyMode: 'strict', storyPlan: [], storyLock: null, storyBaseSeed: 0, sceneGarb: '', scenePhase: '',
  // 丝袜（2026-11-14）：sockPick=用户在下拉里指定的类型（''=自动/'none'=不要）；
  // sockLock=自动模式下本批第一次抽到的类型，后面整批统一成它
  sockPick: '', sockLock: '', bust: '', bustTouched: false,
  // 参考图锁定（2026-11-14）：story 第 2 张起把上一张当 AnimaRefAdapter 的参考图，
  // 治"第 6–8 张换人"。storyRef=当前参考图文件名；refGuid=强度；refOn=开关

async function loadData(){
  const files = {tags:'wb_tags.json', chars:'wb_chars.json', scenes:'wb_scenes.json', presets:'wb_presets.json', zh:'wb_zh.json', pools:'wb_pools.json', outfits:'wb_outfits.json', atoms:'wb_atoms.json'};
  const out = {};
  // 每个文件独立 try：8 个 fetch 里死一个，Promise.all 会立刻 reject，
  // 剩下 7 个的 rejection 没人接 → 页面/测试进程直接以 unhandled rejection 收场（2026-11-14 修）
  await Promise.all(Object.entries(files).map(async ([k,f])=>{
    try{ const r = await fetch('/data/'+f); out[k] = await r.json(); }
    catch(e){ logline("loadData", "缺 "+f+" ("+e+")"); }
  }));
  S.lib.tags = out.tags; S.lib.chars = out.chars; S.lib.scenes = out.scenes;
  S.lib.presets = out.presets; S.zh = out.zh; S.pools = out.pools; S.lib.outfits = out.outfits; S.atoms = out.atoms;
  const nTags = out.tags.cats.reduce((a,c)=>a+c.tags.length,0);
  // 3.1 起场景只剩 anima 一套；这里必须容错，任何 .length 打空都会让 boot 整段中断（首屏空白）
  const nSc = Object.keys(out.scenes||{}).reduce((a,k)=>a+((out.scenes[k]||[]).length),0);
  $("stat").textContent = "标签 "+nTags+" · 角色 "+out.chars.chars.length+" · 场景 "+nSc;
    // 池化后 actions 是 11 个池的 dict，没有 L1/L2/L3；旧写法 .L1.length 会抛错，
    // 把整个 boot 打断 → 首屏资料库空白（切一次标签才恢复，因为 click 里直接 renderLib）
    try{
      const ac = (out.atoms && out.atoms.actions) || {};
      const tn = Object.keys(ac).reduce((a,k)=>a+((ac[k]||[]).length),0);
      window.__atomN = tn + "条/" + (((out.atoms||{}).meta||{}).combinations||0) + "组合";
    }catch(e){ window.__atomN = "err:" + e.message; }
  $("libCount").textContent = "标签 "+nTags+" / 角色 "+out.chars.chars.length+" / 服饰 "+((out.outfits&&out.outfits.items||[]).length)+" / 场景 "+nSc;
}

function styleTrigTags(){
  const out = [];
  if(S.styleId){
    const st = (S.lib.styles||[]).find(x=>x.id===S.styleId);
    if(st && st.trig) out.push.apply(out, parseTags(escArtist(st.trig)));

  if(S.charId){

     把衣服画回去 —— 日志实证 23:28 那批的最终提示词里 deepseek_maid_outfit_zipzippipe
     仍然在（页面这条路无条件拼 trig），所以这里要按当前衣物段分。 */
  const cc = (S.lib.charsLora||[]).find(x=>x.id===S.charId);
  const nudeNow = (S.sceneGarb === 'none')
    || (S.tags||[]).some(t=>['completely_nude','nude','naked'].indexOf(K(t)) >= 0);
  if(cc && cc.trig) out.push.apply(out, parseTags(cc.trig));
  if(cc && cc.trig_outfit && !nudeNow) out.push.apply(out, parseTags(cc.trig_outfit));

/* 换画风/换角色后，上一个包的触发词会留在正文和 userTags 里（addTag 加进去的），
   结果"选回原版角色 tag"也照样带着 deepseek_whale_girl_zipzippipe 跑。这里统一清。 */
function stripStaleTriggers(){
  const keep = [K(String(S.styleId||'')), K(String(S.charId||''))];
  const dead = [];
  const add = (arr)=>{ (arr||[]).forEach(x=>{ if(!x || !x.trig) return;
    if(keep.indexOf(K(String(x.id||''))) >= 0) return;
    parseTags(escArtist(x.trig)).forEach(t=>dead.push(K(t))); }); };
  add(S.lib.styles); add(S.lib.charsLora);
  if(!dead.length) return 0;
  const n0 = (S.tags||[]).length;
  S.tags = (S.tags||[]).filter(t=>dead.indexOf(K(t)) < 0);
  S.userTags = (S.userTags||[]).filter(t=>dead.indexOf(K(t)) < 0);
  dead.forEach(k=>{ delete S.owner[k]; });
  return n0 - S.tags.length;
}

/* 画师名里的括号会被 ComfyUI 当成权重语法：
   kanpa_(campagne_9) → 解析成「kanpa_」+ 权重组，画师 tag 直接失效。
   插进提示词前统一转义成 kanpa_\\(campagne_9\\)。 */
function escArtist(t){
  /* Anima 是 Cosmos-Predict2，不吃 (tag:1.3) 这种权重语法，画师要写 @ 前缀、
     名字里的括号属于名字本身：kanpa_(campagne_9) → @kanpa (campagne 9)。 */
  const s = String(t).trim();
  if(!s) return '';
  /* 多词触发词（如 claude_girl, orange hair, ...）按列表原样用，不能整串加 @ */
  if(s.indexOf(',') >= 0) return s;
  const core = s.charAt(0) === '@' ? s.slice(1) : s;
  return '@' + core.replace(/_/g, ' ');
}

  6:[0,1,1,2,3,4], 7:[0,1,1,2,2,3,4], 8:[0,0,1,1,2,2,3,4],

          if(nb) rep.fixes.push('剧情·后入只绑手腕 ' + nb);
        }
        if(MD.banPose && MD.banPose.length){
          const signP2 = blockSignedPose(String(o.block || ''));
          const bp2 = new Set(MD.banPose.map(low).filter(k => !signP2[k]));
          const nb = a.length;
          a = a.filter(t => !bp2.has(low(t)));
          if(nb !== a.length) rep.fixes.push('剧情·' + MD.zh + '去冲突姿势 ' + (nb - a.length));
        }
        const td = MD.deny || [];
        if(td.length){
          const nd = cut(td);
          if(nd) rep.fixes.push('剧情·' + MD.zh + '去男体 ' + nd);
        }
        /* 身份词必须活下来 */
        const want2 = MD.tone || [];
        if(want2.length && !want2.some(w => a.some(t => low(t) === low(w)))){
          push(want2[Math.floor(Math.random() * want2.length)]);
          rep.fixes.push('剧情·' + MD.zh + '身份词兜底');
        }
      }
    }
  }catch(e){ logline("modFix", "ERR " + e); }

  /* ---- ⑦c 无层行最终清场（P7-K）----
     composeShot 的入场清场挡不住"同块第 2 张仍带 hypnosis"（层词在清场之后又被塞回来）。
     这里用行级真实值 o.mod 收口：没挂层就把两层的 tone/look 全部剥净。 */
  try{
    if(o.forceStory && !o.mod){
      const _all = [];
      (MOD_DEFS || []).forEach(m => { _all.push.apply(_all, (m.tone||[]).concat(m.look||[])); });
      const _ks = new Set(_all.map(low));
      const _d = a.filter(x => _ks.has(low(x)));
      if(_d.length){
        const _dn = cut(_d);
        if(_dn) rep.fixes.push('剧情·未挂层去层词 ' + _dn);
      }
    }
  }catch(e){ logline("modClean", "ERR " + e); }
  /* 机位真空兜底（定稿前最后一道）：一个机位词都没有的行在 190 张抽卡里占 10%，
     看图时等于"块名说了侧面、图上没交代视角"。补最通用的 from_side。 */
  try{
    if(o.forceStory){
      const _CAM = (ANGLES || []).map(low);
      if(!a.some(x => _CAM.indexOf(low(x)) >= 0)){
        /* 按块挑该块自己的合法机位，别一律 from_side —— 那是把"没机位"
           换成"全是侧面"，190 张里 from_side 会被顶到一半 */
        let _fb = '';
        try{
          const _bid = String(o.block || '');
          const _i = Object.keys(BLOCK_ANG || {}).indexOf(_bid);
          const _ok = (_i >= 0 && ANG_OK2 && ANG_OK2[BLOCK_ANG[_bid]]) ? (ANG_OK2[BLOCK_ANG[_bid]].ok || []) : [];
          if(_ok.length) _fb = _ok[0];
        }catch(e){}
        a.push(_fb || 'from_side');
        rep.fixes.push('剧情·机位兜底 ' + (_fb || 'from_side'));
      }
    }
  }catch(e){ logline("camFix", "ERR " + e); }

  /* 固定机位最后再钉一次：composeShot 定了 from_side，但 ⑥a 视角冲突 / VFIX /
     崩脸三条都会改机位（3P 那行被"贴头动作"改成 from_above，190 张抽卡实测 1 行）。
     块级 fixedAng 是硬约束，任何上游规则都不许翻。 */
  if(o.block && typeof BLOCK_BY_ID !== 'undefined' && BLOCK_BY_ID[o.block] && BLOCK_BY_ID[o.block].fixedAng){
    const _fa = BLOCK_BY_ID[o.block].fixedAng;
    const _n3 = cut(ANGLES.filter(x => x !== _fa));
    if(!has(_fa)) push(_fa);
    if(_n3) rep.fixes.push('剧情·固定机位 ' + _fa);
  }
  /* 3P：2boys 与 1boy 同框会互相抵消（danbooru 计数冲突），有 2boys 就必须剔 1boy */
  if(String(o.block || '') === 'threesome' && a.some(t => low(t) === '2boys')){
    const n1b = cut(['1boy', '1girl']);
    if(n1b) rep.fixes.push('剧情·3P去单人计数 ' + n1b);
    if(!a.some(t => low(t) === '1girl')) push('1girl');
  }
  rep.kind = k;
  rep.pool = R ? o.pool : '';
  rep.n = a.length;
  S.sceneKind = k;
  return {tags: a, rep: rep};
}

function pfShow(rep, tagN){
  const el = $("pfLine"); if(!el) return;
  const zh = PF_KIND_ZH[rep.kind] || rep.kind || '—';
  const fixed = rep.fixes.length;
  el.textContent = '审查 ' + (fixed ? '修' + fixed : '✓') + ' · ' + zh + ' · ' + (tagN || rep.n) + ' 词';
  el.className = 'badge ' + (fixed ? 'warn' : 'ok');
  el.title = (rep.pool ? '池：' + (POOL_ZH[rep.pool] || rep.pool) + '\n' : '') + (fixed ? rep.fixes.join('；') : '人数 / 性别 / 道具一致');
}

function pfDryRun(){
  try{
    const pf = preflight(S.tags, {kind: S.sceneKind, pool: S.scenePool, zh: S.sceneZh,
      forceGarb: S.sceneGarb || '', forcePhase: S.scenePhase || '', finale: !!S.curBlockFinale, forceBeat: (typeof S.sceneBeat==='number'?S.sceneBeat:undefined), family: String(S.sceneType||''), quietUndress: !!S.quietUndress,
    mod: String(S.curMod||''), block: String(S.curBlockKey||'').split('@')[0], niche: !!S.curBlockNiche, forceStory: !!S.story, keepCloth: (S.outfit||[]).concat(S.userTags||[])});
    pfShow(pf.rep, pf.tags.length);
  }catch(e){ logline("pfDryRun", "ERR " + e); }
}

/* ============ 绑定 ============ */
function bind(){
  $("pos").addEventListener("blur",()=>{
    // 手动改过提示词就不再按上次的池管（否则审查会删掉用户自己写的词）
    S.scenePool = ''; S.sceneKind = '';
    setTags(parseTags($("pos").value));
  });
  $("pos").addEventListener("input",()=>{ $("posCount").textContent=parseTags($("pos").value).length+" 词"; });
  $("btnExpand").onclick=doExpand;
  $("btnNorm").onclick=()=>{ setTags(normTags(parseTags($("pos").value))); refreshNeg(true); toast("已按规则整理"); };
  $("btnClear").onclick=()=>{
    // 清空必须把“归属表”一起清掉：历史角色/服饰都存在 userTags/owner 里，
    // 只清 tags/chars 会让上一次的角色在批量时被 base 重新拼回来（两个角色 tag 的根因）
    S.tags=[]; S.chars=[]; S.charTag=null; S.scenes=[]; S.sel={}; S.outfit=[];
    S.userTags=[]; S.owner={}; S.sceneTags=[]; S.sceneName="";
    setTags([]); recount(); syncText(); $("neg").value=""; refreshNeg(true);
    logline("clear");
    toast("已清空（角色/服饰/人数词全部归零）");
  };
  $("btnNegReset").onclick=()=>refreshNeg(true);
  $("btnRoll").onclick=()=>rollLibrary();
  $("btnCfg").onclick=()=>openCfg();
  $("cfgCancel").onclick=()=>closeCfg();
  $("cfgSave").onclick=()=>saveCfg();
  $("cfgMask").onclick=(e)=>{ if(e.target===$("cfgMask")) closeCfg(); };
  $("libRoll").onclick=()=>rollLibrary();
  $("studioRoll").onclick=rollAll;
  $("btnGen").onclick=generate;
  $("btnBatch").onclick=batchRun;
  // 上次跑批中途崩了会把 btnBatch 留在 disabled；刷新后必须复位，否则按钮永远"按不了"
  try{ $("btnBatch").disabled = false; $("btnPause").disabled = true; S.batch = false; }catch(e){}
  $("btnLog").onclick=showLog;
  $("btnPause").onclick=()=>{
    if(!S.batch){ toast("没有在跑的批量"); return; }
    S.pauseAsk = true;
    $("btnPause").textContent = "⏸ 正在停…";
    $("btnPause").disabled = true;
    toast("当前这张跑完就暂停");
  };
  $("btnHand").onclick=handfix;
  $("btnCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(S.tags.join(", ")); toast("已复制"); }catch(e){ toast("复制失败"); } };
  document.querySelectorAll("#libTabs button[data-t]").forEach(b=>b.onclick=()=>{
    S.tab=b.dataset.t; document.querySelectorAll("#libTabs button[data-t]").forEach(x=>x.classList.toggle("on",x===b)); renderLib();
  });
  document.querySelectorAll("#tierSeg button").forEach(b=>b.onclick=()=>{
    S.tier=b.dataset.v; document.querySelectorAll("#tierSeg button").forEach(x=>x.classList.toggle("on",x===b));
    S.presetGrp = (S.tier==='r18') ? 'r18' : 'sfw';
    refreshNeg(true); renderLib();
    toast(S.tier==='r18'
      ? "R18 档：放开 🔞 类目 / r18 场景 / r18 预设"
      : (S.tier==='suggestive' ? "Suggestive 档：只留非 R18 类目，负面加强" : "SFW 档：隐藏 r18 场景与预设，负面加防护词"));
  });
  S.model='anima'; setModelDefaults('anima');
  $("big").onclick=()=>{ $("big").style.display='none'; };
  // 滚轮落在 select 上时也滚容器
  document.addEventListener('wheel', ev=>{
    const t=ev.target;
    if(t && (t.tagName==='SELECT' || t.tagName==='INPUT')){}
    else return;
    const pane=t.closest('.body')||t.closest('#prev')||t.closest('#imgs');
    if(!pane) return;
    ev.preventDefault(); pane.scrollTop += ev.deltaY;
  }, {passive:false});
}

/* 随机一套 = 与批量完全同一套组合逻辑（composeShot 抽池 → 合并角色/服装 → 审查），
   不再用旧的"随机 5–9 个类别标签"，否则同一个种子在单张和批量里行为不一致。 */
/* 本批回放：把上一批的 JSON 拿出来（控制台 wbStoryDump() 直接打印并可复制） */
window.wbStoryDump = function(){
  const s = localStorage.getItem('wb_story_last_v1') || '';
  if(!s){ toast('还没有连续剧情的批次记录'); return ''; }
  try{ console.log(s); }catch(e){}
  try{ navigator.clipboard.writeText(s); toast('已复制本批 JSON（'+s.length+' 字符）'); }
  catch(e){ toast('已打印到控制台（'+s.length+' 字符）'); }
  return s;
};
/* 把记录重新灌回页面：动作词直接复原，用来复现"这一批到底抽了什么" */
window.wbStoryReplay = function(idx){
  const s = localStorage.getItem('wb_story_last_v1') || '';
  if(!s){ toast('还没有批次记录'); return false; }
  let o; try{ o = JSON.parse(s); }catch(e){ return false; }
  const one = (typeof idx === 'number') ? (o.shots||[])[idx] : null;
  if(one){
    setTags(one.tags || []); cleanTags();
    $("qSeed").value = one.seed || '-1';
    toast('已复原第 '+((idx)+1)+' 张 · '+one.phase+' · '+one.shot);
    return true;
  }
  logline("replay", "tier="+o.tier+" baseSeed="+o.baseSeed+" shots="+(o.shots||[]).length);
  toast('本批共 '+((o.shots||[]).length)+' 张（控制台 wbStoryDump() 看全部）');
  return true;
};
function rollLibrary(){
  const sc = composeShot(0,1);
  if(!sc){ toast("抽取失败：池为空"); return; }
  /* 顺序要紧：normTags 内部读 S.scenePool 决定 noActPool / yuriCtx。
     写在 setTags 之后的话，第一张读到空串会走随机注入，其余张读到上一张的池 —— 
     批量里已修，随机一套这里之前漏了。 */
  S.sceneKind = sc.kind || ''; S.scenePool = sc.pool || ''; S.sceneZh = sc.zh || '';
  S.sceneTags = sc.tags.slice(); S.sceneName = sc.zh; S.lastLv = sc.lv;
  setTags(normTags(uniq((S.userTags||[]).concat(S.chars||[]).concat(S.outfit||[]).concat(styleTrigTags())).concat(sc.tags)));
  cleanTags(); refreshNeg(true);
  const pf = preflight(S.tags, {kind:S.sceneKind, pool:S.scenePool, zh:S.sceneZh,
    forceGarb: S.sceneGarb || '', forcePhase: S.scenePhase || '', finale: !!S.curBlockFinale, forceBeat: (typeof S.sceneBeat==='number'?S.sceneBeat:undefined), family: String(S.sceneType||''), quietUndress: !!S.quietUndress,
    mod: String(S.curMod||''), block: String(S.curBlockKey||'').split('@')[0], niche: !!S.curBlockNiche, forceStory: !!S.story, keepCloth: (S.outfit||[]).concat(S.userTags||[])});
  S.tags = pf.tags; syncText(); pfShow(pf.rep, S.tags.length);
  toast("随机：" + (sc.zh||"组合") + (pf.rep.fixes.length? " · 审查修 "+pf.rep.fixes.length : ""));
}

function safe(fn, tag){
  /* 一个 id 写错不该让整页骨架变白：每段初始化独立兜住，错进 logline（2026-11-14 修） */
  try{ fn(); }catch(e){ logline("uiErr", tag + " " + e); try{ console.error("[ui] "+tag, e); }catch(_){} }
}

(async function boot(){
  safe(bind, "bind");
  try{ await loadData(); }catch(e){ console.error("boot/loadData", e); $("stat").textContent="数据加载失败 "+(e&&e.stack||e); return; }
  try{ const r = await fetch('/api/styles'); const j = await r.json();
    if(j.ok){ S.lib.styles = j.styles || []; S.styleId = j.current || null; }
  }catch(e){ console.error("boot/styles", e); }
  try{ const r2 = await fetch('/api/anima/chars'); const j2 = await r2.json();
    if(j2.ok){ S.lib.charsLora = j2.chars || []; S.charId = j2.current || null; }
  }catch(e){ console.error("boot/charLora", e); }
  safe(renderLib, "renderLib"); safe(renderStudio, "renderStudio"); safe(syncText, "syncText");
  safe(()=>{ $("neg").value = defaultNeg(); }, "neg");
  safe(()=>{ $("stat").textContent += " · 就绪"; }, "stat");
})();
window.addEventListener('error', (e)=>{ window.__ERR = (window.__ERR||0)+1;
  try{ logline("jsErr", (e && (e.message||e.type)) || "?"); }catch(_){} });
</script>
